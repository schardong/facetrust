[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facetrust"
version = "0.1.0"
description = "Métricas de verificação biométrica, qualidade de imagem, watermarking e potencial de ataque de morphing, para o tutorial 'Biometrics under attack: On provenance, trust and threat robustness', ministrado no SIBGRAPI 2026."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Guilherme G. Schardong" },
]
keywords = ["biometrics", "face recognition", "watermarking", "morphing attack", "media forensics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "scikit-image>=0.20",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "Pillow>=9.4",
]

[project.urls]
Repository = "https://github.org/schardong/facetrust"

# Dependências opcionais
[project.optional-dependencies]
arcface = [
  "insightface>=0.7",
  "onnxruntime>=1.15",       # troque por onnxruntime-gpu se tiver CUDA
]
lpips = [
  "torch>=2.0",
  "lpips>=0.1.4",
]
ssl-watermarking = [
  "torch>=1.10",
  "torchvision>=0.11",
  "augly",
]
rosteals = [
  "torch>=1.11",
  "torchvision>=0.12",
  "pytorch-lightning",
  "omegaconf",
  "einops",
]
dev = [
  "pytest>=7.0",
]
all = [
  "facetrust[arcface,lpips,ssl-watermarking,rosteals]",
]

[tool.setuptools]
packages = ["facetrust", "facetrust.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
